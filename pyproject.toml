[project]
name = "hind-desktop-icons"
version = "0.1.0"
description = "一键隐藏 / 恢复 Windows 桌面图标，打包为单文件 exe"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "npera2", email = "2378937886@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pystray>=0.19.5",
]

[project.scripts]
hind-desktop-icons = "hind_desktop_icons:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
