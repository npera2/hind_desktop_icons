name: Release

# 打 tag（形如 v0.1.0）即自动构建单文件 exe 并发布到 GitHub Releases；
# 也可以在 Actions 页面手动触发（workflow_dispatch）填一个版本号。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本号，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  # 让所有 Python 步骤按 UTF-8 输出。runner 的默认代码页是 cp1252，
  # 工具脚本里的中文 print 会直接抛 UnicodeEncodeError（这正是 v0.1.0 第一次失败的原因）。
  # 工具脚本里另有 errors="replace" 兜底，两层保险。
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $raw = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          $version = $raw -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+)*$') {
            throw "版本号格式不正确：$raw（应为 v1.2.3 这种形式）"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "本次发布版本：$version"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装 MinGW 工具链（提供 gcc 与 windres）
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: 安装依赖
        run: uv sync

      - name: 生成图标
        run: uv run python tools/make_assets.py

      - name: 构建单文件 exe
        # 刻意不写死编译器路径：runner 上预装的是 C:\mingw64\bin，
        # setup-msys2 装的在 C:\msys64\mingw64\bin，脚本会自己找到能用的那个
        # （顺序：PATH → 常见目录，并自动跳过 MSYS 目标的 gcc）。
        run: >
          uv run python tools/build_launcher.py
          --version ${{ steps.ver.outputs.version }}

      - name: 冒烟测试
        shell: pwsh
        run: |
          # 坑：PowerShell 用 & 调用 GUI 子系统的程序时**不会等待，也不设置 $LASTEXITCODE**，
          # 于是 `$LASTEXITCODE -ne 0` 会因为空值而误判为失败（这个 exe 是 -mwindows，属 GUI）。
          # 必须用 Start-Process -Wait -PassThru 才能拿到真实退出码。
          function Test-Exe([string]$Path, [string]$Label) {
            $full = Join-Path $PWD $Path
            $p = Start-Process -FilePath $full -ArgumentList "--status" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$Label 失败，退出码 $($p.ExitCode)" }
            Write-Host "$Label 通过"
          }

          # 1) 载荷能独立运行（CI 上没有桌面图标，读到"未知"属正常）
          Test-Exe "build\payload_dist\DesktopIconToggle-portable\DesktopIconToggle.exe" "载荷自检"

          # 2) 启动器能展开载荷并启动它（首次运行的完整链路）
          Test-Exe "dist\DesktopIconToggle.exe" "启动器自检"
          Start-Sleep -Seconds 5
          $installed = Join-Path $env:LOCALAPPDATA "HindDesktopIcons\bin"
          if (-not (Test-Path $installed)) { throw "启动器没有展开载荷" }
          Get-ChildItem $installed | ForEach-Object { Write-Host "已展开：$_" }

          # 3) 产物存在且体积合理
          $exe = Get-Item (Join-Path $PWD "dist\DesktopIconToggle.exe")
          if ($exe.Length -lt 5MB) { throw "exe 体积异常：$($exe.Length) 字节" }
          Write-Host ("冒烟测试通过，exe 体积 {0:N2} MB" -f ($exe.Length / 1MB))

      - name: 发布到 GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Actions 的 pwsh 步骤会设 $ErrorActionPreference = 'stop'。
          # 下面要故意执行一条"会失败"的 gh 探测命令（Release 不存在时），
          # 明确关掉原生命令的该行为，免得它被当成终止性错误。
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = "v${{ steps.ver.outputs.version }}"
          $asset = "dist/DesktopIconToggle.exe"

          # 已存在同名 Release 时改为覆盖上传，重复执行不会失败
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖资产"
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset `
              --title "DesktopIconToggle v${{ steps.ver.outputs.version }}" `
              --generate-notes
          }

          gh release view $tag --json url,tagName,assets --jq '"Release: " + .url, (.assets[] | "资产: " + .name)'
